name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref (keep full runs on the default branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy - run 'go mod tidy' and commit"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold of 70%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Tests bind dynamic ports and use the runner's outbound UDP/53 for
      # real DNS lookups. A failure here is a real regression or a runner
      # network outage - either way it should block the pipeline.
      - name: Run integration tests
        run: go test -v -race -tags=integration -timeout 5m ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o zdns-rest ./cmd/zdns-rest

      - name: Smoke test
        run: ./zdns-rest --version

  build-cross-platform:
    name: Build Cross-Platform
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: [lint, test]
    strategy:
      fail-fast: false
      # zcrypto's ct/x509 has no darwin/arm64 system-roots implementation for
      # CGO_ENABLED=0 builds, so darwin targets build natively on macOS runners
      # with cgo (which also gives them real Keychain roots for DoH).
      matrix:
        include:
          - {goos: linux, goarch: "386", runner: ubuntu-latest, cgo: "0"}
          - {goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: "0"}
          - {goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: "0"}
          - {goos: windows, goarch: "386", runner: ubuntu-latest, cgo: "0"}
          - {goos: windows, goarch: amd64, runner: ubuntu-latest, cgo: "0"}
          - {goos: darwin, goarch: amd64, runner: macos-latest, cgo: "1"}
          - {goos: darwin, goarch: arm64, runner: macos-latest, cgo: "1"}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags="-s -w" -o zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/zdns-rest

      - name: Smoke test linux/amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./zdns-rest-linux-amd64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 7

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t zdns-rest:ci .

      - name: Smoke test image version
        run: docker run --rm zdns-rest:ci --version

      - name: Smoke test image serves /ping
        run: |
          set -euo pipefail
          docker run -d --name zdns-ci -p 127.0.0.1:18080:8080 zdns-rest:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/ping > /dev/null 2>&1; then
              echo "container healthy after ${i}s"
              docker rm -f zdns-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs zdns-ci || true
          docker rm -f zdns-ci >/dev/null
          echo "container did not become healthy"
          exit 1
