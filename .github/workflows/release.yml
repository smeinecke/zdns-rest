name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write        # OIDC for build provenance attestations
  attestations: write    # publish attestations to the repo's attestation store

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag format: $TAG"
            echo "Expected vMAJOR.MINOR or vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${TAG#v}"
          PARTS="${VERSION//./ }"
          set -- $PARTS
          MAJOR="$1"
          MINOR="$2"
          MAJOR_MINOR="${MAJOR}.${MINOR}"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "checkout_ref=refs/tags/$TAG"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      # zcrypto's ct/x509 has no darwin/arm64 system-roots implementation for
      # CGO_ENABLED=0 builds, so darwin targets build natively on macOS runners
      # with cgo (which also gives them real Keychain roots for DoH).
      matrix:
        include:
          - {goos: linux, goarch: "386", runner: ubuntu-latest, cgo: "0"}
          - {goos: linux, goarch: amd64, runner: ubuntu-latest, cgo: "0"}
          - {goos: linux, goarch: arm64, runner: ubuntu-latest, cgo: "0"}
          - {goos: windows, goarch: "386", runner: ubuntu-latest, cgo: "0"}
          - {goos: windows, goarch: amd64, runner: ubuntu-latest, cgo: "0"}
          - {goos: darwin, goarch: amd64, runner: macos-latest, cgo: "1"}
          - {goos: darwin, goarch: arm64, runner: macos-latest, cgo: "1"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" \
            -o zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/zdns-rest

      - name: Smoke test linux/amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./zdns-rest-linux-amd64 --version | grep -F "${{ needs.prepare.outputs.version }}"

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zdns-rest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, build-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            platform: linux/amd64
          - goarch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download matching binary artifact
        uses: actions/download-artifact@v4
        with:
          name: zdns-rest-linux-${{ matrix.goarch }}
          path: docker-dist/

      - name: Prepare Docker binary
        shell: bash
        run: |
          set -euo pipefail
          mv docker-dist/zdns-rest-linux-${{ matrix.goarch }} docker-dist/zdns-rest
          chmod +x docker-dist/zdns-rest
          sha256sum docker-dist/zdns-rest | tee docker-dist/sha256.txt

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          platforms: ${{ matrix.platform }}
          # Push by digest only; the manifest job tags the multi-arch image.
          # name-canonical produces ghcr.io/<repo>@sha256:... refs so no
          # mutable per-arch tag is created.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify image contains released binary
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${{ github.repository }}@${{ steps.build-image.outputs.digest }}"
          docker pull "$IMAGE_REF"
          docker create --name verify-image "$IMAGE_REF" >/dev/null
          docker cp verify-image:/home/zdns/zdns-rest docker-dist/zdns-rest-from-image
          docker rm -f verify-image >/dev/null
          sha256sum docker-dist/zdns-rest-from-image
          cmp -s docker-dist/zdns-rest docker-dist/zdns-rest-from-image

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p image-digests
          digest="${{ steps.build-image.outputs.digest }}"
          touch "image-digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.goarch }}
          path: image-digests/*

  docker-manifest:
    name: Publish Docker Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, docker]
    steps:
      - name: Compute Docker tags
        id: docker-tags
        shell: bash
        run: |
          TAGS=(
            "ghcr.io/${{ github.repository }}:latest"
            "ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.tag }}"
            "ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}"
          )
          if [[ "${{ needs.prepare.outputs.version }}" != "${{ needs.prepare.outputs.major_minor }}" ]]; then
            TAGS+=("ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.major_minor }}")
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: image-digests/
          pattern: image-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=()
          for digest_file in image-digests/*; do
            digest="$(basename "$digest_file")"
            SOURCES+=("ghcr.io/${{ github.repository }}@sha256:${digest}")
          done

          while IFS= read -r tag; do
            docker buildx imagetools create -t "$tag" "${SOURCES[@]}"
          done <<< "${{ steps.docker-tags.outputs.tags }}"

  release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, build-binaries]
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: zdns-rest-*

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts/
          sha256sum */* | awk '{ sub(".*/", "", $2); print }' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/
          # Every manifest entry must resolve to exactly one artifact whose
          # hash matches what will be published.
          while read -r expected file; do
            match=$(find . -name "$file" -type f | head -1)
            [ -n "$match" ] || { echo "missing artifact: $file"; exit 1; }
            actual=$(sha256sum "$match" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "checksum mismatch: $file"; exit 1; }
          done < SHA256SUMS.txt
          echo "all checksums verified"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          for f in artifacts/*/* artifacts/SHA256SUMS.txt; do
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
